# `alias` = giá trị API/CLI. `select_text` = substring khớp trong menuitem;
# list = alternatives đa ngôn ngữ (UI Cici có locale VI/EN — khớp bất kỳ).
# Image ratios có mô tả kèm trong menu (vd "1:1 (profile photo)") — match bằng alias.
# Verify trên build 147.0.7727.149.
# --------------------------------------------------------------------------- #

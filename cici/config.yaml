    ratios:
      - { alias: "1:1",  select_text: "1:1" }
      - { alias: "2:3",  select_text: "2:3" }
      - { alias: "3:4",  select_text: "3:4" }
      - { alias: "4:3",  select_text: "4:3" }
      - { alias: "9:16", select_text: "9:16" }
      - { alias: "16:9", select_text: "16:9" }
    styles:
      - { alias: portrait,          select_text: ["Chân dung", "Portraits"] }
      - { alias: landscape,         select_text: ["Phong cảnh", "Landscape"] }
      - { alias: anime,             select_text: "Anime" }
      - { alias: 3d,                select_text: "3D" }
      - { alias: cyberpunk,         select_text: "cyberpunk" }
      - { alias: oil-painting,      select_text: ["Tranh sơn dầu", "Oil Painting"] }
      - { alias: watercolor,        select_text: ["Màu nước", "Watercolor"] }
      - { alias: flat-illustration, select_text: ["Minh họa phẳng", "Flat Illustration"] }
      - { alias: children-drawing,  select_text: ["Tranh vẽ của trẻ em", "Children's Drawing"] }
